name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build number (always increasing)
        run: echo "BUILD=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Use the fixed signing key (so every build updates the installed app)
        run: |
          mkdir -p ~/.android
          cp signing/wird-debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tail -3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify required project files
        run: |
          test -f data/quran.json
          test -f native-res/raw/adhan.mp3
          test -f android-native/patch_android_project.py
          COUNT=$(ls mushaf/pages/page-*.jpg | wc -l)
          echo "Mushaf pages: $COUNT"
          test "$COUNT" -eq 604
          COUNT2=$(ls mushaf/shuba/page-*.webp | wc -l)
          echo "Shuba pages: $COUNT2"
          test "$COUNT2" -eq 604

      - name: Prepare web build folder (www)
        run: |
          rm -rf www && mkdir -p www/vendor/ort
          cp index.html manifest.webmanifest sw.js www/
          cp -r css js data icons mushaf assets www/
          # ONNX Runtime Web (used by the recitation checker) - served locally, offline
          cp node_modules/onnxruntime-web/dist/ort.min.js www/vendor/ort.min.js
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm www/vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.mjs www/vendor/ort/ 2>/dev/null || true
          # build number + repo for the in-app updater
          printf "window.WIRD_BUILD = %s;\nwindow.WIRD_REPO = '%s';\n" "$BUILD" "$REPO" > www/js/update-config.js
          cat www/js/update-config.js
          ls -la www/vendor www/vendor/ort

      - name: Add Android platform
        run: npx cap add android

      - name: Remove default launcher icons (ours replace them)
        run: find android/app/src/main/res -name 'ic_launcher*.webp' -delete

      - name: Apply native layer (Java, sounds, manifest, MainActivity)
        run: python3 android-native/patch_android_project.py android

      - name: Ensure location permissions + validate AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import xml.dom.minidom as m
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf8").read()
          add = ""
          for perm in ("android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION", "android.permission.INTERNET"):
              if perm not in s:
                  add += f'\n    <uses-permission android:name="{perm}" />'
          if add:
              s = s.replace("</manifest>", add + "\n</manifest>")
              open(p, "w", encoding="utf8").write(s)
          m.parseString(s.encode("utf8"))
          print("AndroidManifest.xml is valid XML")
          PY

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Set versionCode / versionName
        run: |
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"$BUILD\"/" $F
          grep -n "versionCode\|versionName" $F

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wird-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release file
        if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wird.apk

      - name: Publish GitHub Release (the app checks this for updates)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD }}
          name: نور القرآن ${{ env.BUILD }}
          files: wird.apk
          make_latest: true
